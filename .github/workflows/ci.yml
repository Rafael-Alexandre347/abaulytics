name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: Aplicativo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:security
      - name: Preparar Android nativo
        run: npx expo prebuild --platform android --no-install
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Configurar emulador e executar Maestro
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          script: |
            cd android
            ./gradlew assembleDebug
            cd ..
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell pm grant com.abaulytics android.permission.CAMERA
            curl -Ls https://get.maestro.mobile.dev | bash
            export PATH="$PATH:$HOME/.maestro/bin"
            npm run test:e2e:mobile

  api:
    name: API Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: python -m pip install -r api/requirements.txt
      - run: python -m unittest discover -s api -v
