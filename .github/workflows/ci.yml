name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: Aplicativo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:security
      # TODO: Configurar um emulador Android e o Maestro, depois executar npm run test:e2e:mobile aqui.

  api:
    name: API Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: python -m pip install -r api/requirements.txt
      - run: python -m unittest discover -s api -v
