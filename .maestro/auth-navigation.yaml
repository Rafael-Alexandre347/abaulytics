- assertVisible: "Política de privacidade — Abaulytics"
- tapOn: "Voltar"
- assertVisible: "Criar Conta"
- tapOn:
    text: "Seu nome"
- inputText:
    text: "E2E Usuario"
- tapOn:
    text: "nome@empresa.com"
- inputText:
    text: "e2e@abaulytics.test"
- tapOn:
    text: "••••••••"
- inputText:
    text: "TesteE2E123"
- tapOn:
    text: "Li e aceito a política"
- tapOn: "Criar Conta"
- assertVisible: "Medição de bancada"
- tapOn: "Capturar foto"
- tapOn:
    text: "Permitir"
    optional: true
- assertVisible: "Refazer"
- assertVisible: "Usar esta foto"
- assertNotVisible: "Abaulamento estimado"
- tapOn: "Refazer"
- assertVisible: "Capturar foto"
